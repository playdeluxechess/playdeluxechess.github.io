<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fat Dog 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Figtree:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : titre et couleur à gauche, échiquier encadré de marine à droite (barre d'évaluation, cartes joueurs, boutons pilule).
   Sur téléphone tout passe en une colonne : titre, échiquier, panneau du bot. */
:root{
  --bg:#ffffff; --panel:#ffffff; --soft:#f2f4fb; --line:#d8dff2;
  --ink:#10175a; --muted:#59648f; --accent:#10175a; --accent-ink:#ffffff;
  --navy:#0d1568; --frame:#0d1568; --sq-light:#eef1fb; --sq-dark:#a9b9e2;
  --hl:rgba(60,84,214,.26); --sel:rgba(60,84,214,.45); --danger:#d9344f; --ok:#1f9d6b;
  --font-display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --font-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-size:15px; line-height:1.45;
  padding-block:24px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.intro{display:flex;flex-direction:column;gap:16px;min-width:0}
.stage{display:flex;flex-direction:column;gap:14px;min-width:0;--bs:min(calc(100vw - 32px - 44px),600px)}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:901px){
  .app{grid-template-columns:auto minmax(260px,1fr);grid-template-areas:"intro intro" "stage panel";column-gap:30px;align-items:start}
  .intro{grid-area:intro} .stage{grid-area:stage;--bs:clamp(260px,calc(100vw - 32px - 30px - 280px - 52px - 122px),560px)} .panel{grid-area:panel}
  .app[data-tab=pick]{grid-template-columns:minmax(0,1fr);grid-template-areas:"intro" "pick"} .pick{grid-area:pick}
}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,4vw,40px);letter-spacing:-.02em;margin:0;line-height:1.08;text-wrap:balance}
.sub{color:var(--muted);font-size:16px;max-width:46ch;text-wrap:pretty}
.sub b{color:var(--ink);font-weight:600}
.label{font:600 11px var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.colors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.colors button{display:flex;align-items:center;justify-content:center;gap:9px;padding:13px 10px;border-radius:999px;border:2px solid transparent;background:var(--panel);color:var(--ink);font:600 15px var(--font-body);cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.colors button:hover{box-shadow:0 0 0 1px var(--ink)}
.colors button[aria-pressed="true"]{border-color:var(--ink);box-shadow:none}
.ic{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);flex:none}
.ic.w{background:var(--panel)} .ic.b{background:var(--ink)} .ic.r{background:linear-gradient(90deg,var(--ink) 50%,var(--panel) 50%)}

/* Cartes joueurs */
.pcard{display:flex;align-items:center;gap:14px;min-width:0}
.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:0 0 0 3px var(--panel),0 0 0 4px var(--line)}
.avatar.bot{background:var(--navy)} .avatar.me{background:#fff}
.avatar .pcs{width:80%;height:80%}
.pname{font-family:var(--font-display);font-weight:800;font-size:19px;line-height:1.2}
.psub{color:var(--muted);font-size:14px}
.pinfo{min-width:0}

/* Échiquier */
.boardrow{display:flex;align-items:flex-start;gap:12px}
.vwrap{display:none;flex-direction:column;align-items:center;gap:8px;margin-top:26px;width:34px;flex:none}
@media (min-width:901px){.vwrap{display:flex}}
.vbar{width:100%;height:var(--bs);border-radius:8px;background:var(--navy);position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.vfill{position:absolute;left:0;right:0;bottom:0;height:50%;background:#fff;transition:height .45s ease}
.vbar.flip .vfill{top:0;bottom:auto}
.vnum{font:500 12px var(--font-mono);color:var(--ink)}
.frame{position:relative;background:var(--frame);border-radius:18px;padding:22px;width:calc(var(--bs) + 44px);flex:none;max-width:100%}
@media (min-width:901px){.frame{padding:26px;width:calc(var(--bs) + 52px)}}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:var(--bs);height:var(--bs);touch-action:manipulation}
.ranks{position:absolute;left:0;top:22px;width:22px;height:var(--bs);display:grid;grid-template-rows:repeat(8,1fr)}
.files{position:absolute;left:22px;bottom:0;width:var(--bs);height:22px;display:grid;grid-template-columns:repeat(8,1fr)}
@media (min-width:901px){.ranks{top:26px;width:26px}.files{left:26px;height:26px}}
.ranks span,.files span{display:flex;align-items:center;justify-content:center;font:600 11px var(--font-body);color:#fff}
.sq{position:relative;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;cursor:pointer}
.sq.l{background:var(--sq-light)} .sq.d{background:var(--sq-dark)}
.sq.last::before,.sq.sel::before{content:"";position:absolute;inset:0;background:var(--hl)}
.sq.sel::before{background:var(--sel)}
.sq.chk{box-shadow:inset 0 0 0 calc(var(--bs) / 8 * .07) var(--danger)}
.sq.mv::after{content:"";position:absolute;width:26%;height:26%;border-radius:50%;background:var(--navy);opacity:.34}
.sq.tk::after{content:"";position:absolute;inset:5%;border-radius:50%;border:calc(var(--bs) / 8 * .08) solid var(--navy);opacity:.36}

/* Pièces dessinées en SVG : marine plein ou blanc cerné de marine */
.pcs{display:block;width:88%;height:88%;pointer-events:none;overflow:visible}
.pcs .ol{fill:var(--navy);stroke:var(--navy);stroke-width:3.4;stroke-linejoin:round}
.pcs.w .fl{fill:#fff;stroke:none}
.pcs.b .fl{fill:var(--navy);stroke:none}
.pcs .dt{fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.pcs.w .dt{stroke:var(--navy)} .pcs.b .dt{stroke:#dfe6ff}
.sq .pcs{position:relative;z-index:1}

.me-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;font:600 15px var(--font-body);padding:11px 18px;border-radius:999px;border:0;background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.pill:hover:not(:disabled){box-shadow:0 0 0 1px var(--ink)}
.pill.dark{background:var(--navy);color:#fff;box-shadow:none}
:root:not([data-theme="light"]) .pill.dark{background:var(--accent);color:var(--accent-ink)}
.pill:disabled{opacity:.45;cursor:not-allowed}
.pill svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.status{display:flex;align-items:center;gap:10px;font-weight:600;min-height:24px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.dot.busy{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.dot.over{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot.busy{animation:none}.vfill,.hfill{transition:none!important}}

/* Panneau du bot */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.engine{color:var(--muted);font-size:13px}
.thought{background:var(--soft);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.san{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1.05;min-height:32px}
.say{margin:0;font-size:15px;text-wrap:pretty}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 12px var(--font-mono);border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 9px}
.chip.pick{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hrow{display:flex;align-items:center;gap:10px}
@media (min-width:901px){.hrow{display:none}}
.hbar{flex:1;height:10px;border-radius:6px;background:var(--navy);overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.hfill{height:100%;width:50%;background:#fff;transition:width .45s ease}
.hnum{font:500 13px var(--font-mono);min-width:46px;text-align:right}
.moves{display:grid;grid-template-columns:34px 1fr 1fr;font:13px var(--font-mono);max-height:170px;overflow:auto;align-content:start}
.moves div{padding:4px 6px}
.moves .n{color:var(--muted)}
.moves .cur{background:var(--soft);border-radius:6px;font-weight:500}
.moves .empty{grid-column:1 / -1;color:var(--muted);font-family:var(--font-body)}
.caprow{display:flex;align-items:center;gap:8px;min-height:28px}
.caprow .who{width:44px;color:var(--muted);font-size:13px;flex:none}
.caps{display:flex;flex-wrap:wrap;min-width:0}
.caps .pcs{width:22px;height:22px;margin-right:-5px}
.adv{font:500 12px var(--font-mono);color:var(--muted)}
.bubble{position:relative;display:flex;align-items:baseline;gap:12px;background:var(--panel);border-radius:16px;padding:12px 16px;box-shadow:0 0 0 1px var(--line);margin-bottom:6px;min-width:0}
.bubble::after{content:"";position:absolute;left:24px;bottom:-7px;width:14px;height:14px;background:var(--panel);transform:rotate(45deg);box-shadow:1px 1px 0 0 var(--line)}
.bubble .san{font-size:22px;min-height:0;flex:none}
.bubble .say{flex:1;min-width:0}
.wm{position:absolute;right:24px;top:6px;font:700 11px var(--font-body);letter-spacing:.02em;color:#fff;opacity:.9}
@media (min-width:901px){.wm{top:8px}}
.opp{display:flex;align-items:center;gap:14px}
.chips:empty::before{content:"Les coups comparés par le bot apparaîtront ici.";color:var(--muted);font-size:14px}
.sq.land::before{animation:landflash .7s ease-out}
@keyframes landflash{0%{background:rgba(60,84,214,.7)}100%{background:var(--hl)}}
.ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0}
.ghost .pcs{width:88%;height:88%}
@media (prefers-reduced-motion:reduce){.sq.land::before{animation:none}}
.promo{position:fixed;inset:0;background:rgba(10,14,40,.55);display:grid;place-items:center;z-index:20;padding:16px}
.promo[hidden]{display:none!important}
.promo-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;align-items:center}
.promo-row{display:flex;gap:10px}
.promo-row button{width:68px;height:68px;border-radius:14px;border:1px solid var(--line);background:var(--sq-light);cursor:pointer;display:grid;place-items:center;padding:0}
.promo-row button:hover{border-color:var(--navy)}
.promo-row .pcs{width:84%;height:84%}
.tabs{display:flex;gap:8px}
.pill[aria-pressed=true]{background:var(--navy);color:#fff;box-shadow:none}
.pick{display:none;flex-direction:column;gap:16px;max-width:760px}
.app[data-tab=pick] .pick{display:flex} .app[data-tab=pick] .stage,.app[data-tab=pick] .panel{display:none}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.sl{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:10px;font-size:14px}
.capcol{display:flex;flex-direction:column;justify-content:space-between;width:64px;height:var(--bs);margin-top:22px;flex:none}
@media (min-width:901px){.capcol{margin-top:26px}}
.capcol .who{font:600 10px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
@media (max-width:600px){.boardrow{flex-wrap:wrap}.capcol{flex-direction:row;width:100%;height:auto;margin:0;gap:12px}.capcol>div{flex:1}}
.chat{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto}
.msg{background:var(--soft);border-radius:12px;padding:8px 12px;font-size:14px}.msg b{font-family:var(--font-display);margin-right:6px}
.st{display:grid;grid-template-columns:100px 1fr 28px;align-items:center;gap:10px;font-size:13px}
.bar{height:8px;border-radius:5px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--navy)}
#statBox{display:flex;flex-direction:column;gap:8px}
#customBox{display:flex;flex-direction:column;gap:12px}
.sq.mate{z-index:3;box-shadow:inset 0 0 0 calc(var(--bs) / 8 * .07) var(--danger)}
.sq.mate .pcs{transform-origin:50% 90%;animation:fall .9s cubic-bezier(.5,0,.9,.6) forwards}
@keyframes fall{0%{transform:rotate(0)}15%{transform:rotate(-6deg)}100%{transform:rotate(88deg) translateY(8%)}}
@media (prefers-reduced-motion:reduce){.sq.mate .pcs{animation:none;transform:rotate(88deg)}}
.mod{display:flex;flex-direction:column;gap:6px}
#eloRow{flex-direction:column;gap:14px} #eloRow .sl{grid-template-columns:150px 1fr}
.notes{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
.notes:empty::before{content:"Joue un coup : je dirai s'il est théorique et s'il est bon.";color:var(--muted);font-size:13px}
.note{font-size:13px;border-left:3px solid var(--line);padding:2px 0 2px 10px}
.note b{font-family:var(--font-mono);margin-right:6px}.note .gr{font-weight:700;margin-right:6px}.note i{color:var(--muted);font-style:normal}
.g0{color:var(--ok)}.g1{color:var(--ink)}.g2{color:#b88400}.g3{color:#d9702c}.g4{color:var(--danger)}
.sq.chk .pcs{animation:trem .16s linear infinite}
@keyframes trem{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-2px) rotate(-3deg)}75%{transform:translateX(2px) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.sq.chk .pcs{animation:none}}
</style>

<div class="app" id="app" data-tab="play">
  <header class="intro">
    <h1>Fat Dog 2</h1>
    <div class="tabs"><button type="button" class="pill" data-tab="play" aria-pressed="true">Partie</button><button type="button" class="pill" data-tab="pick" aria-pressed="false">Choix</button></div>
  </header>

  <section class="pick">
    <div class="card"><div class="label">Votre couleur</div>
      <div class="colors" role="group"><button type="button" data-color="w" aria-pressed="true"><span class="ic w"></span>Blancs</button><button type="button" data-color="b" aria-pressed="false"><span class="ic b"></span>Noirs</button><button type="button" data-color="r" aria-pressed="false"><span class="ic r"></span>Aléatoire</button></div></div>
    <div class="card"><div class="label">Niveau (Elo)</div><div id="eloRow" class="opts"></div></div>
    <div class="card"><div class="label">Style de Fat Dog 2</div><div id="styleRow" class="opts"></div>
      <div class="label">Style d'un grand joueur</div><div id="legRow" class="opts"></div>
      <div id="customBox"><div class="label">Créer mon style</div><div id="sliders"></div><div><button id="customBtn" type="button" class="pill">Utiliser mon style</button></div></div>
      <p id="styleDesc" class="sub"></p><div id="statBox"></div></div>
    <div><button id="goBtn" type="button" class="pill dark">Jouer contre Fat Dog 2</button></div>
  </section>

  <section class="stage">
    <div class="bubble" aria-live="polite">
      <div id="san" class="san">…</div>
      <p id="say" class="say">Prêt ? Fat Dog 2 t'attend.</p>
    </div>
    <div class="pcard">
      <div id="av-top" class="avatar bot"></div>
      <div class="pinfo"><div id="nm-top" class="pname">Fat Dog 2</div><div id="sb-top" class="psub"></div></div>
    </div>
    <div class="boardrow">
      <div class="vwrap" title="Évaluation vue des Blancs">
        <div id="vbar" class="vbar"><div id="vfill" class="vfill"></div></div>
        <div id="vnum" class="vnum">0.00</div>
      </div>
      <div class="frame">
        <div class="wm" aria-hidden="true">Fat Dog 2</div>
        <div id="ranks" class="ranks" aria-hidden="true"></div>
        <div id="board" class="board" role="grid" aria-label="Échiquier"></div>
        <div id="files" class="files" aria-hidden="true"></div>
      </div>
      <div class="capcol">
        <div><div class="who">Fat Dog 2 a pris</div><div id="capBot" class="caps"></div><span id="advBot" class="adv"></span></div>
        <div><span id="advMine" class="adv"></span><div id="capMine" class="caps"></div><div class="who">Vous avez pris</div></div>
      </div>
    </div>
    <div class="me-row">
      <div class="pcard">
        <div id="av-bot" class="avatar me"></div>
        <div class="pinfo"><div id="nm-bot" class="pname">Vous</div><div id="sb-bot" class="psub"></div></div>
      </div>

      };

}
function sfAnalyze(w,fen,ms){
  return new Promise(function(res){
    var best={};
    var timeout=setTimeout(finish,ms+7000);
    function finish(){ w.removeEventListener('message',h); clearTimeout(timeout);
      res(Object.keys(best).map(function(k){return best[k]}).sort(function(a,b){return b.cp-a.cp})); }
    function h(e){
      var t=e.data; if(typeof t!=='string') return;
      if(t.indexOf('info')===0 && t.indexOf(' pv ')>-1 && t.indexOf('score')>-1){
        if(t.indexOf('lowerbound')>-1||t.indexOf('upperbound')>-1) return;
        var mp=/multipv (\d+)/.exec(t), dp=/depth (\d+)/.exec(t), sc=/score (cp|mate) (-?\d+)/.exec(t), pv=/ pv (\S+)/.exec(t);
        if(!sc||!pv) return;
        var k=mp?+mp[1]:1, d=dp?+dp[1]:0, cp=+sc[2];
        if(sc[1]==='mate') cp=(cp>0?1:-1)*(10000-Math.abs(cp)*50);
        if(!best[k]||d>=best[k].depth) best[k]={uci:pv[1],cp:cp,depth:d};
      } else if(t.indexOf('bestmove')===0){ finish(); }
    }
    w.addEventListener('message',h);
    w.postMessage('position fen '+fen);
    w.postMessage('go movetime '+ms);
  });
}

/* ---------- Moteur interne de secours : minimax alpha-bêta ---------- */
function evalInternal(g){
  var s=0, b=g.board();
  for(var r=0;r<8;r++) for(var c=0;c<8;c++){
    var p=b[r][c]; if(!p) continue;
    var v=VAL[p.type], sign=p.color==='w'?1:-1;
    var rankFromOwn=p.color==='w'?7-r:r;
    var cen=3.5-Math.abs(c-3.5), cenR=3.5-Math.abs(r-3.5);
    var bonus=0;
    if(p.type==='p') bonus=rankFromOwn*6+cen*2;
    else if(p.type==='n'||p.type==='b') bonus=(cen+cenR)*4;
    else if(p.type==='q') bonus=(cen+cenR);
    s+=sign*(v+bonus);
  }
  return s;
}
function negamax(g,depth,alpha,beta){
  if(depth===0){ var e=evalInternal(g); return g.turn()==='w'?e:-e; }
  var ms=g.moves({verbose:true});
  if(!ms.length) return g.in_check()?-30000-depth:0;
  ms.sort(function(a,b){return (b.captured?VAL[b.captured]*10-VAL[b.piece]:0)-(a.captured?VAL[a.captured]*10-VAL[a.piece]:0)});
  var best=-Infinity;
  for(var i=0;i<ms.length;i++){
    g.move(ms[i]); var sc=-negamax(g,depth-1,-beta,-alpha); g.undo();
    if(sc>best) best=sc; if(best>alpha) alpha=best; if(alpha>=beta) break;
  }
  return best;
}
function internalAnalyze(g){
  var ms=g.moves({verbose:true}), out=[];
  for(var i=0;i<ms.length;i++){
    g.move(ms[i]); var sc=-negamax(g,2,-Infinity,Infinity); g.undo();
    out.push({uci:ms[i].from+ms[i].to+(ms[i].promotion||''),cp:sc,depth:3});
  }
  out.sort(function(a,b){return b.cp-a.cp});
  return out.slice(0,4);
}

/* ---------- Style de jeu ---------- */
function material(g,color){
  var s=0, b=g.board();
  for(var r=0;r<8;r++) for(var c=0;c<8;c++){ var p=b[r][c]; if(p) s+=(p.color===color?1:-1)*VAL[p.type]; }
  return s;
}
function findKing(g,color){
  var b=g.board();
  for(var r=0;r<8;r++) for(var c=0;c<8;c++){ var p=b[r][c]; if(p&&p.type==='k'&&p.color===color) return FILES[c]+(8-r); }
  return null;
}
function evaluateCandidate0(m,cp,doBait){
  var me=game.turn(), opp=me==='w'?'b':'w', ply=game.history().length;
  var before=material(game,me);
  var base0=(me==='w'?1:-1)*evalInternal(game);
  game.move({from:m.from,to:m.to,promotion:m.promotion});
  var s=0, tags=[];
  function add(v,t){ s+=v; if(t&&tags.indexOf(t)<0) tags.push(t); }
  if(m.san.indexOf('#')>-1) add(1000,'mate');
  else if(m.san.indexOf('+')>-1) add(35,'check');
  if(m.captured){
    add(18+Math.max(0,(VAL[m.captured]-VAL[m.piece])/12),'capture');
    if(cp>200 && VAL[m.captured]>=VAL[m.piece]-20) add(10,'simplify');
  }
  if(m.promotion) add(60,'promo');
  if(m.flags.indexOf('k')>-1||m.flags.indexOf('q')>-1) add(26,'castle');
  var home=me==='w'?'1':'8';
  if((m.piece==='n'||m.piece==='b') && m.from.charAt(1)===home && ply<24) add(16,'develop');
  if(['d4','e4','d5','e5'].indexOf(m.to)>-1) add(7,'center');
  if(m.piece==='n' && (m.to.charAt(0)==='a'||m.to.charAt(0)==='h')) add(-8);
  if(m.piece==='p'){
    var ek=findKing(game,opp);
    if(ek && Math.abs(FILES.indexOf(m.to.charAt(0))-FILES.indexOf(ek.charAt(0)))<=1 && ply>=8) add(8,'pawnpush');
  }
  if(m.piece==='k' && m.flags.indexOf('k')<0 && m.flags.indexOf('q')<0 && ply<30) add(-22);
  if(m.piece==='b' && (m.to==='c4'||m.to==='c5') && ply<12) add(8);
  if(!game.in_check()){
    try{
      var f=game.fen().split(' '); f[1]=me; f[3]='-';
      var ng=new Chess(f.join(' ')), th=0, mv=ng.moves({verbose:true});
      for(var i=0;i<mv.length;i++){
        var t=mv[i];
        if(t.from!==m.to||!t.captured) continue;
        if(VAL[t.captured]>=500 && VAL[t.captured]>VAL[t.piece]) th=Math.max(th,28);
        else if(VAL[t.captured]>=320 && t.piece==='p') th=Math.max(th,14);
      }
      if(th) add(th,'threat');
    }catch(e){}
  }
  var replies=game.moves({verbose:true}), worst=0;
  if(replies.length){
    worst=Infinity;
    for(var j=0;j<replies.length;j++){
      game.move(replies[j]); var d=material(game,me)-before; game.undo();
      if(d<worst) worst=d;
    }
  }
  if(doBait && ply>=6 && !game.in_check()){
    var greedy=replies.filter(function(x){return x.captured&&VAL[x.captured]>=300}).sort(function(a,b){return VAL[b.captured]-VAL[a.captured]}).slice(0,2);
    if(greedy.length){
      var okBait=true;
      for(var gi=0;gi<greedy.length&&okBait;gi++){
        game.move(greedy[gi]);
        var vb=negamax(game,2,-Infinity,Infinity);
        game.undo();
        if(vb<base0+60) okBait=false;
      }
      if(okBait) add(32,'bait');
    }
  }
  if(game.in_check() && replies.length>0 && replies.length<=3) add(12,'squeeze');
  if(game.in_draw() && !game.in_checkmate()) add(-150,'draw');
  s+=Math.max(-300,Math.min(150,worst))*0.35;
  if(worst<=-250 && m.san.indexOf('#')<0) add(30,'sac');
  game.undo();
  return {m:m,cp:cp,style:s,tags:tags};
}

function chooseMove(lines){

function botSay(t){

  var c=$('chat'), d=document.createElement('div'); d.className='msg';
  var b=document.createElement('b'); b.textContent='Fat Dog 2'; d.appendChild(b); d.appendChild(document.createTextNode(t));
  c.appendChild(d); while(c.children.length>40) c.removeChild(c.firstChild); c.scrollTop=c.scrollHeight;

function openMsg(id,n){
  var t=pick([n+' ! Mon terrain de jeu.',n+' : je connais ça par cœur.','On part sur '+n+'. Accroche-toi.']);
  if(curKey==='poly'){
    if(['qgd','qga','slav','tarr','qgex'].indexOf(id)>-1) t+=' Le gambit dame, mon grand classique.';
    if(['najd','dragon','sves','taim','alap','sicc','morra'].indexOf(id)>-1) t+=' La sicilienne, ma préférée avec les Noirs.';
  } else t+=' '+pick(STYSAY[sk()]);

function theoryInfo(prev,san){
  var n=prev.length, cont=null, hit=null;
  BOOK.forEach(function(l){
    for(var i=0;i<n;i++) if(l.m[i]!==prev[i]) return;
    if(l.m.length>n){ if(!cont) cont=l; if(l.m[n]===san&&(!hit||l.m.length>hit.m.length)) hit=l; }
  });
  if(hit) return {t:1,name:hit.n,end:hit.m.length===n+1};
  if(cont&&n>0) return {t:0,name:cont.n,exp:cont.m[n]};
  return null;
}
function addNote(r,prev){
  var c=$('notes'), n=prev.length, th=theoryInfo(prev,r.san), txt='';
  if(th) txt=th.t?('Théorie : '+th.name+(th.end?' (fin de la ligne connue)':'')):('Hors théorie : dans '+th.name+' on joue '+th.exp+' ici');
  else if(n===0) txt='Ouverture rare, hors de mon livre';
  else if(n<16) txt='Hors de mon livre d\'ouvertures';
  var d=document.createElement('div'); d.className='note';
  d.innerHTML='<b></b><span class="gr"></span><i></i>';
  d.children[0].textContent=Math.ceil((n+1)/2)+(r.color==='w'?'. ':'… ')+r.san;
  d.children[2].textContent=txt;
  if(r.color!==player){ d.children[1].textContent='Fat Dog 2'; d.children[1].className='gr g1'; }
  c.appendChild(d); c.scrollTop=c.scrollHeight; return d;
}
function styleNote(res){
  if(!lastNote||!res.all||!res.all[res.chosen]||res.best===undefined) return;
  var d=res.best-res.all[res.chosen].cp, i=lastNote.children[2];
  if(d>=20) i.textContent+=(i.textContent?' · ':'')+'coup de style (−'+(d/100).toFixed(1)+' vs meilleur)';
}
function reactPlayer(r){
  if(game.game_over()) return;
  if(game.in_check()) botSay(pick(MSG.trem));
  else if(r.captured) botSay(pick(MSG.cap).replace('{p}',PN[r.captured]));

}

function bookMove(){
  var h=game.history(), S=curStyle(), pool=[], tot=0, legalM=game.moves({verbose:true});
  BOOK.forEach(function(l){
    if(l.m.length<=h.length) return;
    for(var i=0;i<h.length;i++) if(l.m[i]!==h[i]) return;
    if(curElo().strong&&DUB.indexOf(l.id)>-1) return;
    var w=S.bk[l.id]!==undefined?S.bk[l.id]:S.bkd; if(w<=0) return;
    var m=legalM.filter(function(x){return x.san===l.m[h.length]})[0];
    if(m){ pool.push({l:l,m:m,w:w}); tot+=w; }
  });
  if(!pool.length) return null;
  var r=Math.random()*tot, c=pool[0];
  for(var j=0;j<pool.length;j++){ r-=pool[j].w; if(r<=0){ c=pool[j]; break; } }
  return {m:c.m,name:c.l.n,id:c.l.id};
}

function render(){
  var b=game.board(), html='', i, r, c;
  var chkSq=null;
  if(game.in_check()) chkSq=findKing(game,game.turn());
  for(r=0;r<8;r++) for(c=0;c<8;c++){
    var file=flip?7-c:c, rank=flip?7-r:r;
    var sq=FILES[file]+(8-rank), p=b[rank][file];
    var dark=((file+(8-rank))%2===1);
    var cls='sq '+(dark?'d':'l');
    if(lastMove&&(lastMove.from===sq||lastMove.to===sq)) cls+=' last';
    if(sel===sq) cls+=' sel';
    if(chkSq===sq) cls+=game.in_checkmate()?' mate':' chk';
    var tgt=legal.filter(function(m){return m.to===sq})[0];
    if(tgt) cls+=(p||tgt.flags.indexOf('e')>-1)?' tk':' mv';
    html+='<div class="'+cls+'" data-sq="'+sq+'" role="gridcell" aria-label="'+sq+(p?' '+p.color+p.type:'')+'">'+
      (p?pieceSVG(p.type,p.color):'')+'</div>';
  }
  $('board').innerHTML=html;
  var rk='', fl='';
  for(i=0;i<8;i++){ rk+='<span>'+(flip?i+1:8-i)+'</span>'; fl+='<span>'+FILES[flip?7-i:i]+'</span>'; }
  $('ranks').innerHTML=rk; $('files').innerHTML=fl;
  $('vbar').classList.toggle('flip',flip);
  renderMoves(); renderCaptured(); renderCards(); updateButtons();
}
function renderCards(){
  var oc=player==='w'?'b':'w';
  $('av-opp').innerHTML=pieceSVG('n','w');
  [['top',oc],['bot',player]].forEach(function(x){
    var pos=x[0], color=x[1], isMe=color===player, turn=game.turn(), txt;
    $('av-'+pos).className='avatar '+(isMe?'me':'bot');
    $('av-'+pos).innerHTML=isMe?pieceSVG('k','b'):pieceSVG('n','w');
    $('nm-'+pos).textContent=isMe?'Vous':'Fat Dog 2';
    if(game.game_over()) txt='partie terminée';
    else if(turn===color) txt=isMe?'à toi de jouer':'réfléchit…';
    else txt=isMe?'en attente':'style '+curStyle().n;
    $('sb-'+pos).textContent=(color==='w'?'Blancs':'Noirs')+' · '+txt;
  });
}
function renderMoves(){
  var h=game.history(), out='';
  if(!h.length){ $('moves').innerHTML='<div class="empty">La partie n\'a pas encore commencé.</div>'; return; }

  }
  var el=$('moves'); el.innerHTML=out; el.scrollTop=el.scrollHeight;

function renderCaptured(){
  var start={p:8,n:2,b:2,r:2,q:1}, cnt={w:{p:0,n:0,b:0,r:0,q:0},b:{p:0,n:0,b:0,r:0,q:0}};
  var b=game.board();
  for(var r=0;r<8;r++) for(var c=0;c<8;c++){ var p=b[r][c]; if(p&&p.type!=='k') cnt[p.color][p.type]++; }
  function lost(color){
    var s='', order=['q','r','b','n','p'];
    order.forEach(function(t){ for(var k=0;k<start[t]-cnt[color][t];k++) s+=pieceSVG(t,color); });
    return s;
  }
  var opp=player==='w'?'b':'w';
  $('capMine').innerHTML=lost(opp);
  $('capBot').innerHTML=lost(player);
  var diff=material(game,player)/100;
  $('advMine').textContent=diff>0?'+'+diff:'';
  $('advBot').textContent=diff<0?'+'+(-diff):'';
}

}
function gameOverText(){
  if(game.in_checkmate()){
    return game.turn()===player?'Échec et mat. Le bot gagne la partie.':'Échec et mat. Vous gagnez la partie !';
  }
  if(game.in_stalemate()) return 'Pat. La partie est nulle.';
  if(game.insufficient_material()) return 'Matériel insuffisant. La partie est nulle.';
  if(game.in_threefold_repetition()) return 'Triple répétition. La partie est nulle.';
  return 'Règle des 50 coups. La partie est nulle.';
}

/* ---------- Déroulement de la partie ---------- */
function animateMove(r){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if(!Element.prototype.animate) return;
  var q=function(sq){return document.querySelector('.sq[data-sq="'+sq+'"]')};
  function slide(from,to,knight){
    var a=q(from), b=q(to); if(!a||!b) return;
    var el=b.querySelector('.pcs'); if(!el) return;
    var ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
    var dx=ra.left-rb.left, dy=ra.top-rb.top;
    el.style.zIndex=10;
    var frames=knight
      ? [{transform:'translate('+dx+'px,'+dy+'px) scale(1)'},{transform:'translate('+dx/2+'px,'+dy/2+'px) scale(1.2)',offset:.5},{transform:'translate(0,0) scale(1)'}]
      : [{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'translate(0,0)'}];
    var an=el.animate(frames,{duration:knight?320:260,easing:'cubic-bezier(.22,.8,.3,1)'});
    an.onfinish=an.oncancel=function(){ el.style.zIndex=''; };
  }
  slide(r.from,r.to,r.piece==='n');
  if(r.flags.indexOf('k')>-1||r.flags.indexOf('q')>-1){
    var rk=r.color==='w'?'1':'8', ks=r.flags.indexOf('k')>-1;
    slide((ks?'h':'a')+rk,(ks?'f':'d')+rk,false);
  }
  if(r.captured){
    var gsq=r.flags.indexOf('e')>-1?r.to.charAt(0)+r.from.charAt(1):r.to;
    var host=q(gsq);
    if(host){
      var g=document.createElement('div'); g.className='ghost';
      g.innerHTML=pieceSVG(r.captured,r.color==='w'?'b':'w');
      host.appendChild(g);
      var ga=g.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.55)'}],{duration:320,delay:140,easing:'ease-in',fill:'both'});
      ga.onfinish=function(){ if(g.parentNode) g.parentNode.removeChild(g); };
    }
  }
  var dest=q(r.to); if(dest) dest.classList.add('land');
  if(game.in_check()&&!game.in_checkmate()){
    var ksq=findKing(game,game.turn()), kh=ksq&&q(ksq), kel=kh&&kh.querySelector('.pcs');
    if(kel) kel.animate([{transform:'translateX(0)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(-3px)'},{transform:'translateX(0)'}],{duration:380,delay:240});
  }
}
function makeMove(m){
  var prev=game.history();
  var r=game.move({from:m.from,to:m.to,promotion:m.promotion});
  if(!r) return null;
  lastMove={from:r.from,to:r.to}; sel=null; legal=[];
  render(); animateMove(r); refreshStatus();
  lastNote=addNote(r,prev);
  if(r.color===player){ pendingNote=lastNote; reactPlayer(r); }
  return r;
}
function afterMove(){
  refreshStatus();
  if(!over && game.turn()!==player) requestBot();
}
function requestBot(){
  thinking=true; var my=++token;
  $('san').textContent='…'; $('say').textContent='Je cherche le meilleur coup…';
  refreshStatus(); updateButtons();
  var book=bookMove();
  if(book){
    setTimeout(function(){
      if(my!==token) return;
      var res={m:book.m,tags:[],all:[],chosen:0,name:book.name,id:book.id};
      showThought(res,true); lastBotCp=null; pendingNote=null;
      thinking=false; makeMove(book.m); afterMove();
    },350+Math.random()*350);
    return;
  }
  var fen=game.fen(), turn=game.turn(), started=Date.now();
  var run=function(){
    if(worker){
      queue=queue.then(function(){ if(my===token) worker.postMessage('setoption name Skill Level value '+curElo().skill); if(my===token) worker.postMessage('setoption name MultiPV value '+curElo().mpv); return my!==token?null:sfAnalyze(worker,fen,curElo().ms); });
      return queue;
    }
    return new Promise(function(res){ setTimeout(function(){ res(internalAnalyze(game)); },60); });
  };
  run().then(function(lines){
    if(my!==token||!lines) return;
    if(!lines.length) lines=internalAnalyze(game);
    var res=chooseMove(lines);
    setEval(lines[0].cp,turn);
    if(pendingNote&&lastBotCp!==null){ var cl=function(v){return Math.max(-1500,Math.min(1500,v))}; gradeNote(pendingNote,cl(lines[0].cp)-cl(lastBotCp)); }
    pendingNote=null; lastBotCp=res.all&&res.all[res.chosen]?res.all[res.chosen].cp:null;
    var wait=Math.max(0,(350+Math.random()*450)-(Date.now()-started));
    setTimeout(function(){
      if(my!==token) return;
      showThought(res,false);
      thinking=false; makeMove(res.m); styleNote(res); afterMove();
    },wait);
  });
}
function onSquare(sq){
  if(thinking||over||game.turn()!==player) return;
  var piece=game.get(sq);
  if(sel && legal.some(function(m){return m.to===sq})){
    var cands=legal.filter(function(m){return m.to===sq});
    if(cands[0].promotion){ askPromotion(sel,sq); return; }
    makeMove({from:sel,to:sq}); afterMove(); return;
  }
  if(piece && piece.color===player){
    sel=sq; legal=game.moves({square:sq,verbose:true});
  } else { sel=null; legal=[]; }
  render();
}
function askPromotion(from,to){
  pendingPromo={from:from,to:to};
  var html='';
  ['q','r','b','n'].forEach(function(t){ html+='<button type="button" data-p="'+t+'" aria-label="'+t+'">'+pieceSVG(t,player)+'</button>'; });
  $('promoRow').innerHTML=html; $('promo').hidden=false;
}
function arrangeAnim(){
  if((window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)||!Element.prototype.animate) return;
  var br=$('board').getBoundingClientRect(), cy=br.top+br.height/2;
  document.querySelectorAll('#board .sq').forEach(function(sq,i){
    var el=sq.querySelector('.pcs'); if(!el) return;
    var r=sq.getBoundingClientRect(), up=(r.top+r.height/2)<cy, col=i%8, row=Math.floor(i/8);
    var dy=up?-(r.top-br.top+r.height*1.5):(br.bottom-r.top+r.height*.5);
    el.animate([{transform:'translateY('+dy+'px) scale(.5)',opacity:0},{transform:'translateY(0) scale(1)',opacity:1}],{duration:520,delay:col*70+(up?row:7-row)*40,easing:'cubic-bezier(.22,.8,.3,1)',fill:'backwards'});
  });
}
function newGame(){
  token++; thinking=false;
  if(worker){ try{worker.postMessage('stop')}catch(e){} }
  game=new Chess(); sel=null; legal=[]; lastMove=null; over=false;
  player=chosen==='r'?(Math.random()<.5?'w':'b'):chosen;
  flip=player==='b';
  $('san').textContent='…'; $('say').textContent='Le bot attend le premier coup.';
  $('vfill').style.height='50%'; $('hfill').style.width='50%'; $('vnum').textContent='0.00'; $('hnum').textContent='0.00';
  $('chat').innerHTML=''; $('notes').innerHTML=''; lastBotCp=null; pendingNote=null; lastNote=null; endSaid=0; botSay(pick(MSG.start));
  render(); arrangeAnim(); refreshStatus();
  if(game.turn()!==player) requestBot();
}
function undo(){
  if(playerMoveCount()===0) return;
  token++; thinking=false;
  if(worker){ try{worker.postMessage('stop')}catch(e){} }
  game.undo();
  if(game.turn()!==player && game.history().length>0) game.undo();
  var h=game.history({verbose:true});
  lastMove=h.length?{from:h[h.length-1].from,to:h[h.length-1].to}:null;
  sel=null; legal=[]; over=false; endSaid=0;
  $('san').textContent='…'; $('say').textContent='Coup repris. À vous de rejouer.';
  var nt=$('notes'); while(nt.children.length>game.history().length) nt.removeChild(nt.lastChild); pendingNote=null; lastBotCp=null;
  render(); refreshStatus();
  if(!game.game_over() && game.turn()!==player) requestBot();
}

/* ---------- Événements ---------- */
$('board').addEventListener('click',function(e){
  var el=e.target.closest('.sq'); if(el) onSquare(el.getAttribute('data-sq'));
});
$('promoRow').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b||!pendingPromo) return;
  var p=b.getAttribute('data-p'), pp=pendingPromo; pendingPromo=null;
  $('promo').hidden=true;
  makeMove({from:pp.from,to:pp.to,promotion:p}); afterMove();
});
$('promo').addEventListener('click',function(e){
  if(e.target===$('promo')){ pendingPromo=null; $('promo').hidden=true; }
});
$('undoBtn').addEventListener('click',undo);
$('flipBtn').addEventListener('click',function(){ flip=!flip; render(); });
$('newBtn').addEventListener('click',newGame);
document.querySelectorAll('.colors button').forEach(function(btn){
  btn.addEventListener('click',function(){
    chosen=btn.getAttribute('data-color');
    document.querySelectorAll('.colors button').forEach(function(x){ x.setAttribute('aria-pressed',x===btn?'true':'false'); });
  });
});

/* ---------- Onglet Choix ---------- */
function tab(t){ $('app').setAttribute('data-tab',t); document.querySelectorAll('.tabs button').forEach(function(b){ b.setAttribute('aria-pressed',b.getAttribute('data-tab')===t?'true':'false'); }); }
document.querySelectorAll('.tabs button').forEach(function(b){ b.addEventListener('click',function(){ tab(b.getAttribute('data-tab')); }); });
function press(sel,attr,val){ document.querySelectorAll(sel).forEach(function(b){ b.setAttribute('aria-pressed',String(b.getAttribute(attr)===String(val))); }); }
var SL_L={ag:'Attaque',ca:'Prudence',tr:'Pièges',po:'Positionnel',en:'Finales',ri:'Sacrifices'};
var ST={
 poly:{ag:60,ca:50,tr:40,po:60,en:55,ri:50},
 timide:{ag:20,ca:90,tr:10,po:60,en:50,ri:10},
 escroc:{ag:50,ca:30,tr:95,po:40,en:40,ri:60},
 posi:{ag:35,ca:65,tr:15,po:95,en:70,ri:15},
 hyper:{ag:45,ca:55,tr:35,po:85,en:60,ri:35},
 fin:{ag:30,ca:60,tr:20,po:70,en:95,ri:20},
 aggr:{ag:95,ca:15,tr:40,po:35,en:30,ri:85},
 morphy:{ag:90,ca:30,tr:35,po:70,en:45,ri:75,elo:2690,fav:'gambit Évans, partie italienne, gambit du roi'},
 lasker:{ag:60,ca:65,tr:80,po:70,en:85,ri:45,elo:2720,fav:'espagnole, gambit dame refusé, écossaise'},
 capa:{ag:40,ca:75,tr:10,po:85,en:98,ri:10,elo:2725,fav:'gambit dame refusé, espagnole, Caro-Kann'},
 tal:{ag:98,ca:15,tr:70,po:45,en:40,ri:98,elo:2700,fav:'Najdorf, Dragon, gambit du roi'},
 fischer:{ag:75,ca:55,tr:20,po:80,en:85,ri:30,elo:2785,fav:'e4, espagnole, Najdorf, est-indienne'},
 karpov:{ag:45,ca:80,tr:15,po:98,en:92,ri:10,elo:2780,fav:'Caro-Kann, espagnole, gambit dame refusé'}
};
Object.keys(ST).forEach(function(k){ STY[k].stats=ST[k]; });
var DEF={}, LEG=['morphy','lasker','capa','tal','fischer','karpov'];
['morphy','lasker','capa','tal','fischer','karpov'].forEach(function(k){ var c=buildCustom(ST[k]); STY[k].m=c.m; STY[k].tol=c.tol; });
Object.keys(STY).forEach(function(k){ if(STY[k].stats) DEF[k]={stats:JSON.parse(JSON.stringify(STY[k].stats)),m:STY[k].m,tol:STY[k].tol}; });
function pickStyle(k){
  curKey=k; press('[data-st]','data-st',k);
  var S=curStyle(), st=S.stats, h='', lock=LEG.indexOf(k)>-1; $('customBox').hidden=lock;
  $('styleDesc').textContent=S.n+' : '+S.d;
  if(st){
    h+='<div class="sub">'+(lock?'Stats fixes : ce style reproduit le joueur et ne peut pas être modifié.':'Déplace les curseurs pour modifier son style de jeu.')+'</div>';
    Object.keys(SL_L).forEach(function(x){ h+=lock?'<div class="st"><span>'+SL_L[x]+'</span><div class="bar"><i style="width:'+st[x]+'%"></i></div><b>'+st[x]+'</b></div>':'<div class="st"><span>'+SL_L[x]+'</span><input type="range" min="0" max="100" value="'+st[x]+'" data-ss="'+x+'"><b id="sv-'+x+'">'+st[x]+'</b></div>'; });
    if(k!=='custom'&&!lock) h+='<div><button type="button" class="pill" id="resetSt">Réinitialiser les stats</button></div>';
    if(st.elo) h+='<div class="sub">Elo estimé (pic) : <b>'+st.elo+'</b> · Ouvertures : '+st.fav+'</div><div><button type="button" class="pill" id="useElo">Jouer à son niveau ('+st.elo+')</button></div>';
  }
  $('statBox').innerHTML=h;
  var u=$('useElo'); if(u) u.addEventListener('click',function(){ pickElo(st.elo); });
  document.querySelectorAll('[data-ss]').forEach(function(i){ i.addEventListener('input',function(){
    var x=i.getAttribute('data-ss'); S.stats[x]=+i.value; $('sv-'+x).textContent=i.value;
    var c=buildCustom(S.stats); S.m=c.m; S.tol=c.tol; if(k==='custom'){ S.bk=c.bk; S.bkd=c.bkd; }
  }); });
  var r=$('resetSt'); if(r) r.addEventListener('click',function(){ var d=DEF[k]; S.stats=JSON.parse(JSON.stringify(d.stats)); S.m=d.m; S.tol=d.tol; pickStyle(k); });
}
function pickElo(e){ ELOK=e; press('[data-elo]','data-elo',e); var sl=$('eloSl'); if(sl) sl.value=e; var ev=$('eloVal'); if(ev) ev.textContent='Elo libre : '+e; }
var ELOMOD=[['Débutant',[800,1000,1200]],['Club',[1500,1800,2000]],['Maître',[2300,2600]],['Super grand maître',[2721,2746,2882]],['Maximum',[3620]]];
$('eloRow').innerHTML=ELOMOD.map(function(m){return '<div class="mod"><div class="label">'+m[0]+'</div><div class="opts">'+m[1].map(function(e){return '<button type="button" class="pill" data-elo="'+e+'" aria-pressed="false">'+e+'</button>'}).join('')+'</div></div>'}).join('')+'<label class="sl"><span id="eloVal">Elo libre</span><input type="range" id="eloSl" min="800" max="3620" step="5" value="2300"></label>';
$('eloSl').addEventListener('input',function(){ pickElo(+this.value); });
function stBtns(keys){ return keys.map(function(k){return '<button type="button" class="pill" data-st="'+k+'" aria-pressed="false">'+STY[k].n+(STY[k].stats&&STY[k].stats.elo?' · '+STY[k].stats.elo:'')+'</button>'}).join(''); }
$('styleRow').innerHTML=stBtns(['poly','timide','escroc','posi','hyper','fin','aggr']);
$('legRow').innerHTML=stBtns(['morphy','lasker','capa','tal','fischer','karpov']);
var SL=[['ag','Agressivité'],['ca','Prudence'],['tr','Pièges'],['po','Positionnel'],['en','Finales'],['ri','Sacrifices']];
$('sliders').innerHTML=SL.map(function(x){return '<label class="sl"><span>'+x[1]+'</span><input type="range" min="0" max="100" value="50" data-sl="'+x[0]+'"></label>'}).join('');
document.querySelectorAll('[data-elo]').forEach(function(b){ b.addEventListener('click',function(){ pickElo(+b.getAttribute('data-elo')); }); });
document.querySelectorAll('[data-st]').forEach(function(b){ b.addEventListener('click',function(){ pickStyle(b.getAttribute('data-st')); }); });
$('customBtn').addEventListener('click',function(){ var v={}; document.querySelectorAll('[data-sl]').forEach(function(i){ v[i.getAttribute('data-sl')]=+i.value; }); custom=buildCustom(v); custom.stats=v; pickStyle('custom'); press('[data-st]','data-st','none'); });
$('goBtn').addEventListener('click',function(){ tab('play'); newGame(); });
pickElo(2300); pickStyle('poly'); botSay(pick(MSG.start));

/* ---------- Démarrage ---------- */
render(); refreshStatus();
makeEngine().then(function(w){
  worker=w;
  engineName=w?'Stockfish 10 + minimax de style':'moteur interne (minimax)';
  $('engineState').textContent=engineName;
  refreshStatus();
});
window.__fatDog2={onSquare:onSquare,state:function(){return {fen:game.fen(),thinking:thinking,player:player,history:game.history()}}};
})();
</script>
